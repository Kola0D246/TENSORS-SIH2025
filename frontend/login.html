<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Timetable Management System</title>
    <link rel="stylesheet" href="LoginPage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <header>
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-calendar-alt logo-icon"></i>
                    <h1 class="title">College Timetable Management System</h1>
                </div>
            </div>
        </header>
        
        <main class="main-content">
            <div class="login-container">
                <h2 class="login-title">Login to Your Account</h2>
                <form id="login-form">
                    <div class="input-group">
                        <label for="username">Email or Username</label>
                        <input type="text" id="username" class="input-field" placeholder="Enter your email or username" required>
                        <div class="error" id="username-error">Please enter a valid email or username</div>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="input-field" placeholder="Enter your password" required>
                        <div class="error" id="password-error">Password must be at least 6 characters</div>
                    </div>
                    
                    <div class="input-group">
                        <label for="role">Select Role</label>
                        <select id="role" class="select-field" required>
                            <option value="" disabled selected>Select your role</option>
                            <option value="admin">Administrator</option>
                            <option value="faculty">Faculty</option>
                            <option value="hod">HOD</option>
                        </select>
                        <div class="error" id="role-error">Please select your role</div>
                    </div>
                    
                    <button type="submit" class="login-btn">Login</button>
                    
                    <div class="links">
                        <a href="#" class="link">Forgot Password?</a>
                        <a href="#" class="link">Sign Up</a>
                    </div>
                </form>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2023 College Timetable Management System. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
